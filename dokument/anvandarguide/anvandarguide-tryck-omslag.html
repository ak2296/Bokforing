<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>TRYCK – Quee användarguide, omslag (enkelsidigt)</title>
<!--
  Källan till användarguiden. PDF-filen görs med: python dokument/verktyg/make_docs.py
  Uppdatera texten här när appen ändras, och höj versionen på omslaget.
-->
<style>
@font-face { font-family: Inter; src: url(../../assets/fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: Inter; src: url(../../assets/fonts/Inter-Medium.otf); font-weight: 500; }

:root {
  --green: #0B6B4E; --green-2: #3E9B7A; --tint: #E4F2EC; --ink: #10201B; --muted: #62706A;
  --bg: #F5F7F4; --line: #E8ECE6; --amber: #8A5300; --amber-tint: #FFF6E5; --coral: #B4553A;
  --coral-tint: #FBE9E2; --yellow: #FFD600;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: Inter, Arial, sans-serif; color: var(--ink); font-size: 9.6pt; line-height: 1.5; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: 148mm; height: 210mm; padding: 14mm 13mm 16mm; position: relative; overflow: hidden; page-break-after: always; background: white; }
.page:last-child { page-break-after: auto; }
.folio { position: absolute; bottom: 7mm; left: 13mm; right: 13mm; display: flex; justify-content: space-between; font-size: 7.5pt; color: var(--muted); border-top: 0.3mm solid var(--line); padding-top: 2mm; }
h1 { font-size: 19pt; font-weight: 500; margin: 0 0 3mm; letter-spacing: -0.2pt; }
h2 { font-size: 11.5pt; font-weight: 500; margin: 5mm 0 1.5mm; }
h3 { font-size: 10pt; font-weight: 500; margin: 3.5mm 0 1mm; }
p { margin: 0 0 2.2mm; }
ul, ol { margin: 0 0 2.5mm; padding-left: 5mm; }
li { margin-bottom: 1mm; }
.kicker { font-size: 8pt; color: var(--green); font-weight: 500; letter-spacing: 0.6pt; text-transform: uppercase; margin-bottom: 1mm; }
.lead { color: var(--muted); font-size: 10pt; margin-bottom: 4mm; }
.two { display: grid; grid-template-columns: 1fr 50mm; gap: 6mm; align-items: start; }
.two.left { grid-template-columns: 50mm 1fr; }
.tip { background: var(--tint); border-radius: 3mm; padding: 2.5mm 3.5mm; margin: 3mm 0; font-size: 8.8pt; }
.tip b { color: var(--green); font-weight: 500; }
.warn { background: var(--amber-tint); border: 0.3mm solid #F4E2BC; border-radius: 3mm; padding: 2.5mm 3.5mm; margin: 3mm 0; font-size: 8.8pt; color: #5c3a00; }
.warn b { font-weight: 500; }
.steps { counter-reset: s; list-style: none; padding: 0; }
.steps li { counter-increment: s; position: relative; padding-left: 8mm; margin-bottom: 2mm; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0.2mm; width: 5mm; height: 5mm; border-radius: 50%; background: var(--green); color: white; font-size: 7.5pt; font-weight: 500; display: flex; align-items: center; justify-content: center; }
.kbd { display: inline-block; border: 0.3mm solid var(--line); border-radius: 1.5mm; padding: 0 1.5mm; background: #fff; font-weight: 500; font-size: 8.6pt; white-space: nowrap; }
.btn { display: inline-block; background: var(--green); color: #fff; border-radius: 2mm; padding: 0.2mm 2mm; font-weight: 500; font-size: 8.4pt; white-space: nowrap; }
table.t { width: 100%; border-collapse: collapse; font-size: 8.6pt; margin: 2mm 0 3mm; }
table.t td, table.t th { text-align: left; padding: 1.4mm 1.5mm; border-bottom: 0.3mm solid var(--line); vertical-align: top; }
table.t th { font-weight: 500; color: var(--muted); font-size: 7.8pt; }

/* ---------- Telefonskisser ---------- */
.phone { width: 50mm; height: 100mm; border-radius: 6mm; background: #1b2521; padding: 1.6mm; box-shadow: 0 1mm 3mm rgba(0,0,0,0.18); }
.phone.small { width: 44mm; height: 88mm; }
.screen { width: 100%; height: 100%; border-radius: 4.6mm; background: var(--bg); overflow: hidden; position: relative; font-size: 5.6pt; line-height: 1.35; }
.bar { height: 4mm; display: flex; justify-content: space-between; align-items: center; padding: 0 3mm; font-size: 4.6pt; color: var(--muted); }
.apphead { padding: 0.5mm 3mm 1.5mm; font-weight: 500; font-size: 7pt; display: flex; justify-content: space-between; align-items: center; }
.apphead small { display: block; font-weight: 400; font-size: 4.8pt; color: var(--muted); }
.gear { width: 3mm; height: 3mm; border: 0.5mm solid var(--ink); border-radius: 50%; }
.body { padding: 0 2.5mm; }
.card { background: #fff; border: 0.25mm solid var(--line); border-radius: 2.2mm; padding: 1.8mm; margin-bottom: 1.5mm; }
.hero { border-radius: 2.6mm; padding: 2mm 2.4mm; color: #fff; margin-bottom: 1.5mm; background: linear-gradient(135deg, #0B6B4E, #084d38); }
.hero.coral { background: linear-gradient(135deg, #B4553A, #82402c); }
.hero .big { font-size: 9.5pt; font-weight: 500; margin: 0.6mm 0 1mm; }
.hero .stats { display: flex; border-top: 0.2mm solid rgba(255,255,255,0.25); padding-top: 1mm; font-size: 4.6pt; }
.hero .stats div { flex: 1; } .hero .stats b { display: block; font-size: 5.6pt; font-weight: 500; }
.row { display: flex; align-items: center; gap: 1.5mm; padding: 1.2mm 0; border-bottom: 0.2mm solid var(--line); }
.row:last-child { border-bottom: 0; }
.date { width: 5mm; height: 5.4mm; border-radius: 1.4mm; background: var(--tint); color: var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 500; font-size: 5.4pt; line-height: 1; }
.date i { font-style: normal; font-weight: 400; font-size: 3.8pt; }
.date.c { background: var(--coral-tint); color: var(--coral); }
.grow { flex: 1; min-width: 0; } .grow b { font-weight: 500; display: block; } .grow span { color: var(--muted); font-size: 4.8pt; }
.amt { font-weight: 500; }
.chip { display: inline-block; font-size: 4.2pt; padding: 0.1mm 1mm; border-radius: 1mm; background: var(--amber-tint); color: var(--amber); font-weight: 500; }
.nav { position: absolute; bottom: 0; left: 0; right: 0; height: 8mm; background: #fff; border-top: 0.25mm solid var(--line); display: flex; justify-content: space-around; align-items: center; font-size: 4pt; color: var(--muted); }
.nav div { text-align: center; } .nav .on { color: var(--green); font-weight: 500; }
.nav .ic { width: 3mm; height: 3mm; border: 0.45mm solid currentColor; border-radius: 0.8mm; margin: 0 auto 0.4mm; }
.nav .scan { width: 6.4mm; height: 6.4mm; border-radius: 2mm; background: var(--green); margin-top: -2.6mm; display: flex; align-items: center; justify-content: center; }
.nav .scan span { width: 3mm; height: 3mm; border: 0.5mm solid #fff; border-radius: 0.6mm; }
.bars { display: flex; align-items: flex-end; gap: 1.2mm; height: 12mm; padding: 1mm 0; }
.bars div { flex: 1; display: flex; gap: 0.4mm; align-items: flex-end; height: 100%; }
.bars s { flex: 1; background: var(--green); border-radius: 0.5mm 0.5mm 0 0; text-decoration: none; }
.bars s + s { background: #E8916E; }
.field { background: #fff; border: 0.25mm solid var(--line); border-radius: 1.6mm; padding: 1mm 1.6mm; margin-bottom: 1.2mm; position: relative; }
.field label { display: block; color: var(--muted); font-size: 4.2pt; }
.field .v { font-size: 6pt; }
.field .ok, .field .q { position: absolute; right: 1.4mm; top: 1.8mm; width: 2.6mm; height: 2.6mm; border-radius: 50%; border: 0.4mm solid var(--green); }
.field .q { border-color: var(--amber); background: var(--amber-tint); }
.field.warn-f { background: #F6F2E8; }
.save { background: var(--green); color: #fff; text-align: center; border-radius: 2mm; padding: 1.4mm; font-weight: 500; margin: 1mm 0 0.8mm; }
.links { display: flex; justify-content: space-between; color: var(--green); font-size: 4.8pt; padding: 0 1mm; }
.camera { background: #0C1411; }
.camera .view { position: absolute; left: 1.5mm; right: 1.5mm; top: 6mm; bottom: 17mm; border-radius: 2.4mm; background: #4b4f4a; overflow: hidden; }
.camera .paper { position: absolute; left: 7mm; top: 7mm; width: 31mm; height: 47mm; background: #f4f2ec; transform: rotate(-4deg); box-shadow: 0 0 0 0.6mm var(--yellow), 0 0 0 30mm rgba(255,214,0,0.0); }
.camera .paper::before { content: ''; position: absolute; inset: 0; background: rgba(255,214,0,0.16); }
.camera .lines { position: absolute; left: 3mm; right: 3mm; top: 4mm; }
.camera .lines i { display: block; height: 0.5mm; background: #b9b7b0; margin-bottom: 1.6mm; }
.camera .under { position: absolute; left: 3mm; top: 14mm; width: 30mm; height: 44mm; background: #dcd9d0; transform: rotate(8deg); }
.camera .bubble { position: absolute; right: 2mm; bottom: 2mm; width: 9mm; height: 9mm; border-radius: 50%; background: rgba(0,0,0,0.45); border: 0.3mm solid rgba(255,255,255,0.7); }
.camera .bubble::before { content: ''; position: absolute; left: 2.6mm; top: 2.6mm; width: 3.2mm; height: 3.2mm; border-radius: 50%; border: 0.25mm solid rgba(255,255,255,0.6); }
.camera .bubble::after { content: ''; position: absolute; left: 3mm; top: 3mm; width: 2.4mm; height: 2.4mm; border-radius: 50%; background: #5FE0B0; }
.camera .hint { position: absolute; left: 6mm; right: 6mm; top: 2mm; background: rgba(20,90,50,0.8); color: #fff; text-align: center; border-radius: 1.4mm; padding: 0.8mm; font-size: 4.6pt; }
.camera .shutter { position: absolute; bottom: 4mm; left: 50%; margin-left: -4.5mm; width: 9mm; height: 9mm; border-radius: 50%; border: 0.6mm solid #5FE0B0; }
.camera .shutter::after { content: ''; position: absolute; inset: 0.8mm; border-radius: 50%; background: #5FE0B0; }
.camera .mode { position: absolute; bottom: 6mm; color: #aeb9b3; font-size: 4.4pt; }
.callout { position: absolute; background: var(--ink); color: #fff; font-size: 6.6pt; border-radius: 1.6mm; padding: 0.8mm 1.6mm; white-space: nowrap; }
.num { display: inline-flex; width: 4mm; height: 4mm; border-radius: 50%; background: var(--yellow); color: var(--ink); font-size: 6.4pt; font-weight: 500; align-items: center; justify-content: center; margin-right: 1mm; }
.shot { position: relative; }
.shot .num { position: absolute; margin: 0; box-shadow: 0 0 0 0.5mm #fff; }
.tabs { display: flex; background: var(--line); border-radius: 1.6mm; padding: 0.4mm; margin-bottom: 1.5mm; }
.tabs div { flex: 1; text-align: center; padding: 0.6mm 0; font-size: 4.6pt; color: var(--muted); }
.tabs .on { background: #fff; border-radius: 1.2mm; color: var(--ink); font-weight: 500; }
.share { display: flex; height: 2.4mm; border-radius: 1.2mm; overflow: hidden; margin: 1mm 0 1.2mm; }
.legend { display: flex; align-items: center; gap: 1mm; font-size: 4.8pt; padding: 0.3mm 0; }
.legend i { width: 1.6mm; height: 1.6mm; border-radius: 50%; display: inline-block; }

/* ---------- Omslag ---------- */
.cover { background: var(--green); color: #fff; padding: 0; }
.cover .inner { position: absolute; inset: 0; padding: 20mm 14mm; }
.cover .logo { width: 22mm; height: 22mm; border-radius: 5mm; box-shadow: 0 0 0 0.6mm rgba(255,255,255,.35); overflow: hidden; }
.cover .logo img { width: 22mm; height: 22mm; display: block; }
.cover h1 { font-size: 34pt; margin: 10mm 0 2mm; letter-spacing: -0.8pt; }
.cover .sub { font-size: 13pt; opacity: 0.9; }
.cover .tag { position: absolute; left: 14mm; bottom: 18mm; font-size: 9pt; opacity: 0.85; }
.cover .deco { position: absolute; right: -18mm; top: 70mm; transform: rotate(-12deg); opacity: 0.95; }
.toc { list-style: none; padding: 0; margin-top: 5mm; }
.toc li { display: flex; gap: 2mm; padding: 1.8mm 0; border-bottom: 0.3mm solid var(--line); font-size: 10pt; }
.toc li span:first-child { color: var(--green); font-weight: 500; width: 7mm; }
.toc li span:nth-child(2) { flex: 1; }
.toc li span:last-child { color: var(--muted); }
.legend-tbl td:first-child { width: 27mm; white-space: nowrap; }
.icon-ok, .icon-q, .icon-x { display: inline-block; width: 3.4mm; height: 3.4mm; border-radius: 50%; vertical-align: -0.6mm; margin-right: 1mm; }
.icon-ok { border: 0.5mm solid var(--green); }
.icon-q { border: 0.5mm solid var(--amber); background: var(--amber-tint); }
.icon-x { background: #F6F2E8; border: 0.5mm solid #b38a3c; }
</style>

<style>
@page { size: 297mm 210mm; margin: 0; }
.side { width: 297mm; height: 210mm; display: flex; page-break-after: always; overflow: hidden; position: relative; }
.side:last-child { page-break-after: auto; }
.slot { width: 148.5mm; height: 210mm; overflow: hidden; position: relative; }
.slot > .page { page-break-after: auto; }
.fold { position: absolute; left: 148.5mm; width: 0; height: 4mm; border-left: 0.2mm solid #b9b9b9; }

.backcover .mark img { width: 11mm; height: 11mm; border-radius: 2.6mm; }
.backcover .mark span { font-size: 9pt; font-weight: 500; color: #0B6B4E; letter-spacing: 0.3pt; }
.notes .line { height: 7.4mm; border-bottom: 0.25mm solid #DCE3DB; }
</style>
</head>
<body>
<div class="side"><div class="slot"><section class="page backcover">
  <div class="mark"><img src="../bilder/app-ikon.png" alt=""><span>Quee</span></div>
