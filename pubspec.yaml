name: bokforing
description: Lokal bokföringsassistent för småföretag i Sverige.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.9.0

# Versions checked on pub.dev 2026-10-31.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  camera: ^0.12.2
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.12.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^13.3.0
  cryptography: ^2.9.0
  flutter_local_notifications: ^22.3.3
  flutter_tabler_icons: ^1.43.0
  timezone: ^0.11.2
  receive_sharing_intent: 1.8.1
  sensors_plus: ^7.1.1
  saf_util: ^3.1.1
  saf_stream: ^4.0.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  archive: '>=4.0.0 <4.6.0'

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
