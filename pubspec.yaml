name: bokforing
description: Lokal bokföringsassistent för småföretag i Sverige.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# Versions checked on pub.dev 2026-10-31. Database and PDF packages come later.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.0
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
