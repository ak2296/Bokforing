<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aktiveringskoder</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 0 auto; padding: 16px; color: #17261f; background: #fff; }
  label { display: block; margin-top: 14px; font-size: 14px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #b9c4be; border-radius: 8px; margin-top: 4px; }
  textarea { font-family: monospace; font-size: 14px; }
  button { margin-top: 16px; padding: 12px 18px; font-size: 16px; background: #0b6b4f; color: #fff; border: 0; border-radius: 8px; }
  button.quiet { background: #fff; color: #0b6b4f; border: 1px solid #0b6b4f; margin-left: 8px; }
  .fel { color: #8a1c1c; margin-top: 12px; }
  .note { color: #55625c; font-size: 13px; }
</style>
</head>
<body>
<h1>Aktiveringskoder</h1>
<p class="note">Sidan arbetar bara i den här webbläsaren. Inget skickas iväg och nyckeln sparas inte.</p>

<label for="namn">Företagsnamn</label>
<input id="namn" autocomplete="off">
<label for="org">Organisationsnummer</label>
<input id="org" autocomplete="off">
<label for="slut">Sista giltiga dag</label>
<input id="slut" type="date">
<label for="nyckel">Hemlig nyckel</label>
<input id="nyckel" type="password" autocomplete="off" placeholder="Från bokforing-hemlig-nyckel.txt">

<button id="skapa" type="button">Skapa kod</button>
<div id="fel" class="fel" role="alert"></div>

<label for="kod">Kod att skicka till kunden</label>
<textarea id="kod" rows="5" readonly></textarea>
<button id="kopiera" type="button" class="quiet">Kopiera koden</button>

<script>
function b64(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function makeCode(secret, id, name, org, until) {
  const parts = secret.trim().split('.');
  if (parts.length !== 2) throw new Error('Nyckeln har fel format.');
  const key = await crypto.subtle.importKey(
    'jwk', { kty: 'OKP', crv: 'Ed25519', d: parts[0], x: parts[1] }, { name: 'Ed25519' }, false, ['sign']);
  const clean = s => s.replace(/\|/g, ' ').trim();
  const payload = new TextEncoder().encode([id, clean(name), clean(org), until].join('|'));
  const signature = await crypto.subtle.sign({ name: 'Ed25519' }, key, payload);
  return 'BOK1.' + b64(payload) + '.' + b64(signature);
}

const el = id => document.getElementById(id);

el('skapa').onclick = async () => {
  el('fel').textContent = '';
  el('kod').value = '';
  if (!el('namn').value.trim() || !el('org').value.trim()) { el('fel').textContent = 'Fyll i företagsnamn och organisationsnummer.'; return; }
  if (!el('slut').value) { el('fel').textContent = 'Välj sista giltiga dag.'; return; }
  if (!el('nyckel').value.trim()) { el('fel').textContent = 'Klistra in den hemliga nyckeln.'; return; }
  try {
    const id = 'K' + Date.now().toString(36);
    el('kod').value = await makeCode(el('nyckel').value, id, el('namn').value, el('org').value, el('slut').value);
    el('nyckel').value = '';
  } catch (e) {
    el('fel').textContent = e instanceof Error && e.message.startsWith('Nyckeln')
      ? e.message
      : 'Det gick inte att skapa koden. Kontrollera nyckeln och att webbläsaren är uppdaterad.';
  }
};

el('kopiera').onclick = () => { if (el('kod').value) navigator.clipboard.writeText(el('kod').value); };
</script>
</body>
</html>
