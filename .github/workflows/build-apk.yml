name: Bygg Android-APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Skapa plattformsmappar (android/ios) utan att skriva över koden
        run: |
          flutter create --platforms=android,ios --project-name bokforing --org se.bokforing .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: bokforing-apk
          path: build/app/outputs/flutter-apk/app-release.apk
