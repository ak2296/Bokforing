name: Bygg Android-APK

on:
  workflow_dispatch:
  push:
    # User guide, card and package designs need no new APK.
    paths-ignore:
      - 'dokument/**'
      - '*.md'

jobs:
  build:
    # Repo variable RUNNER=self-hosted sends the build to your own machine.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Frigör diskutrymme
        # Never delete system folders on your own machine.
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Skapa plattformsmappar (android/ios) om de saknas
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --project-name bokforing --org se.bokforing .
            rm -f test/widget_test.dart
          fi

      - name: App-ikon
        run: cp -r android_icon/res/. android/app/src/main/res/

      - name: Android-inställningar
        run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          sed -i 's/flutter\.minSdkVersion/24/' "$f"
          # Shrinking (R8) broke ML Kit at runtime in an earlier release build.
          sed -i 's/\(signingConfig = signingConfigs.getByName("debug")\)/\1\n            isMinifyEnabled = false\n            isShrinkResources = false/' "$f"
          m=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $m || sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' $m
          # INTERNET is used only by the optional "Förbättrad analys", after consent.
          grep -q 'android.permission.INTERNET' $m || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $m
          # The in-app update (direct-download build only) hands the new APK to Android's installer.
          grep -q 'REQUEST_INSTALL_PACKAGES' $m || sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' $m
          # Keep the encrypted API key and the database out of Android cloud backup.
          grep -q 'allowBackup' $m || sed -i 's|<application|<application android:allowBackup="false"|' $m
          # Payment reminders (flutter_local_notifications): survive reboots,
          # receivers for scheduled notifications, core library desugaring.
          grep -q 'RECEIVE_BOOT_COMPLETED' $m || sed -i 's|<application|<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application|' $m
          if ! grep -q 'ScheduledNotificationReceiver' $m; then
            perl -0pi -e 's#</application>#    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n            </intent-filter>\n        </receiver>\n    </application>#' $m
          fi
          # The share plugin compiles Java and Kotlin for different JVM targets;
          # that is harmless on Android, so the strict check is turned off.
          grep -q 'jvm.target.validation' android/gradle.properties || echo 'kotlin.jvm.target.validation.mode=IGNORE' >> android/gradle.properties
          # The own PC has 8 GB in all; the template's 8 GB Gradle heap froze it.
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            sed -i '/^org.gradle.jvmargs=/d; /^org.gradle.daemon=/d; /^org.gradle.workers.max=/d' android/gradle.properties
            printf 'org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G\norg.gradle.daemon=false\norg.gradle.workers.max=2\n' >> android/gradle.properties
          fi
          # Share to the app: PDFs and images from e-mail and other apps.
          sed -i 's/android:launchMode="singleTop"/android:launchMode="singleTask"/' $m
          # The name under the app icon.
          sed -i 's/android:label="[^"]*"/android:label="Quee"/' $m
          if ! grep -q 'application/pdf' $m; then
            perl -0pi -e 's#</intent-filter>#</intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.SEND"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="application/pdf"/>
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.SEND"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="image/*"/>
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:scheme="content" android:mimeType="application/pdf"/>
            </intent-filter>#' $m
          fi
          # The fixed signing key for every build: the debug signing config,
          # which release also uses, reads the file named in QUEE_KEYSTORE.
          grep -q 'QUEE_KEYSTORE' "$f" || perl -0pi -e 's/(\n    buildTypes \{)/\n    signingConfigs {\n        getByName("debug") {\n            storeFile = file(System.getenv("QUEE_KEYSTORE") ?: error("QUEE_KEYSTORE saknas"))\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }$1/' "$f"
          grep -q 'QUEE_KEYSTORE' "$f" || { echo "::error title=Signering::Kunde inte lägga in signeringen i build.gradle.kts"; exit 1; }
          grep -q 'isCoreLibraryDesugaringEnabled' "$f" || perl -0pi -e 's/compileOptions \{/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$f"
          # Fingerprint unlock (local_auth): needs the permission, a fragment
          # activity and an AppCompat theme for the phone's own prompt.
          grep -q 'USE_BIOMETRIC' $m || sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application|' $m
          act=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$act"
          for st in $(find android/app/src/main/res -name 'styles.xml'); do
            sed -i 's|@android:style/Theme.Light.NoTitleBar|Theme.AppCompat.Light.NoActionBar|g; s|@android:style/Theme.Black.NoTitleBar|Theme.AppCompat.NoActionBar|g' "$st"
          done
          grep -q 'androidx.appcompat:appcompat' "$f" || printf '\ndependencies {\n    implementation("androidx.appcompat:appcompat:1.7.0")\n}\n' >> "$f"
          grep -q 'desugar_jdk_libs' "$f" || printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$f"
          echo "----- $f"; cat "$f"
          echo "----- settings.gradle"; cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle
          echo "----- manifest"; cat $m
          grep -n "minSdk\|Minify\|Shrink" "$f" || true
          grep -n "permission" $m || true

      - name: Fast signeringsnyckel
        # The same key for every build, so a new version installs over the old
        # one and keeps its data. Without the secrets Gradle makes a random key.
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_ENC }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PW }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error title=Signering::Nyckeln saknas i GitHub-hemligheterna. Utan den kan en ny version inte installeras över en tidigare."
            exit 1
          fi
          # Gradle is told this exact file (see build.gradle.kts below); the
          # default debug key location is not used, since on GitHub's machines
          # Gradle made a new random key there for every build.
          store="$RUNNER_TEMP/quee-signering.keystore"
          echo "$KS" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PW -out "$store"
          echo "QUEE_KEYSTORE=$store" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$store" -storepass android -alias androiddebugkey | grep -i "SHA256:" | head -1

      - name: SQLite för databastester
        # On your own machine, install libsqlite3-dev once by hand (sudo asks for a password).
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - run: flutter pub get

      - name: Kodanalys
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.txt

      - name: Tester
        if: always()
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test.txt
          echo "::notice title=Tester::$(tail -n 1 /tmp/test.txt)"

      - name: Versionsnummer
        # Minutes since 1970: always rising, unique per build, far below Android's limit.
        # The app compares it with the number in the latest release to offer an update.
        run: echo "BUILD_NUMBER=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Bygg debug-APK
        run: |
          set -o pipefail
          flutter build apk --debug --build-number=$BUILD_NUMBER --dart-define=BUILD_NUMBER=$BUILD_NUMBER 2>&1 | tee /tmp/build.txt

      - name: Bygg release-APK (utan krympning)
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink --build-number=$BUILD_NUMBER --dart-define=BUILD_NUMBER=$BUILD_NUMBER 2>&1 | tee -a /tmp/build.txt
          printf '%s' "$BUILD_NUMBER" > build/app/outputs/flutter-apk/build.txt

      - name: Kontrollera signeringen
        # Both APKs must carry the fixed key, or a phone will refuse to update.
        run: |
          # apksigner reads the v2 signature that apps for Android 7+ use
          # (keytool only reads the old v1 kind, which these APKs lack).
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          want=$(keytool -list -v -keystore "$QUEE_KEYSTORE" -storepass android -alias androiddebugkey | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Fast nyckel: $want"
          for apk in build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-debug.apk; do
            got=$("$apksigner" verify --print-certs "$apk" | grep -i "certificate SHA-256 digest" | head -1 | sed 's/.*digest: *//' | tr -d ':' | tr 'A-F' 'a-f')
            echo "$apk: $got"
            if [ "$got" != "$want" ]; then
              echo "::error title=Signering::$apk är inte signerad med den fasta nyckeln."
              exit 1
            fi
          done
          echo "::notice title=Signering::Båda APK-filerna är signerade med den fasta nyckeln ($want)"

      # Error output as annotations, readable on the public run page and API.
      - name: Felrapport
        if: failure()
        run: |
          for f in /tmp/analyze.txt /tmp/test.txt /tmp/build.txt; do
            [ -f "$f" ] || continue
            body=$(grep -E "error|Error|ERROR|warning •|FAILED|Expected|Actual|\[E\]|failed|Exception|\.dart:[0-9]+" "$f" | grep -v "^\s*$" | head -n 80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] && echo "::error title=$(basename $f)::$body"
            echo "### $(basename $f)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: bokforing-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/build.txt
