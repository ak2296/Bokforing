name: Bygg Android-APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Skapa plattformsmappar (android/ios) om de saknas
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --project-name bokforing --org se.bokforing .
            rm -f test/widget_test.dart
          fi

      - name: Android-inställningar
        run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          sed -i 's/flutter\.minSdkVersion/24/' "$f"
          # Shrinking (R8) broke ML Kit at runtime in an earlier release build.
          sed -i 's/\(signingConfig = signingConfigs.getByName("debug")\)/\1\n            isMinifyEnabled = false\n            isShrinkResources = false/' "$f"
          m=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $m || sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' $m
          # INTERNET is used only by the optional "Förbättrad analys", after consent.
          grep -q 'android.permission.INTERNET' $m || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $m
          # Keep the encrypted API key and the database out of Android cloud backup.
          grep -q 'allowBackup' $m || sed -i 's|<application|<application android:allowBackup="false"|' $m
          # Payment reminders (flutter_local_notifications): survive reboots,
          # receivers for scheduled notifications, core library desugaring.
          grep -q 'RECEIVE_BOOT_COMPLETED' $m || sed -i 's|<application|<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application|' $m
          if ! grep -q 'ScheduledNotificationReceiver' $m; then
            perl -0pi -e 's#</application>#    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n            </intent-filter>\n        </receiver>\n    </application>#' $m
          fi
          grep -q 'isCoreLibraryDesugaringEnabled' "$f" || perl -0pi -e 's/compileOptions \{/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$f"
          grep -q 'desugar_jdk_libs' "$f" || printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$f"
          echo "----- $f"; cat "$f"
          echo "----- settings.gradle"; cat android/settings.gradle.kts 2>/dev/null || cat android/settings.gradle
          echo "----- manifest"; cat $m
          grep -n "minSdk\|Minify\|Shrink" "$f" || true
          grep -n "permission" $m || true

      - name: SQLite för databastester
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - run: flutter pub get

      - name: Kodanalys
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.txt

      - name: Tester
        if: always()
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test.txt
          echo "::notice title=Tester::$(tail -n 1 /tmp/test.txt)"

      - name: Bygg debug-APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build.txt

      - name: Bygg release-APK (utan krympning)
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink 2>&1 | tee -a /tmp/build.txt

      # Error output as annotations, readable on the public run page and API.
      - name: Felrapport
        if: failure()
        run: |
          for f in /tmp/analyze.txt /tmp/test.txt /tmp/build.txt; do
            [ -f "$f" ] || continue
            body=$(grep -E "error|Error|ERROR|warning •|FAILED|Expected|Actual|\[E\]|failed|Exception|\.dart:[0-9]+" "$f" | grep -v "^\s*$" | head -n 80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] && echo "::error title=$(basename $f)::$body"
            echo "### $(basename $f)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: bokforing-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
